<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warehouse 3D Map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d1117; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    #app { width: 100vw; height: 100vh; position: relative; }

    #hud {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 18px;
      background: rgba(10,10,25,0.9);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 10; pointer-events: none;
    }
    #hud h1 { color: #e2e8ff; font-size: 1rem; font-weight: 600; letter-spacing: 1px; }
    #hud-hint { color: #555; font-size: 0.72rem; }

    #tooltip {
      position: absolute; display: none; z-index: 20;
      background: rgba(8,8,30,0.96); border: 1px solid rgba(100,180,255,0.35);
      border-radius: 8px; padding: 9px 13px; pointer-events: none; min-width: 170px;
    }
    #tt-loc    { font-size: 0.95rem; font-weight: 700; color: #7dd3fc; margin-bottom: 3px; }
    #tt-status { font-weight: 600; font-size: 0.82rem; }
    #tt-status.empty { color: #4ade80; }
    #tt-status.full  { color: #f87171; }
    #tt-hint   { color: #444; font-size: 0.68rem; margin-top: 4px; }

    #sidebar {
      position: absolute; top: 56px; left: 12px;
      display: flex; flex-direction: column; gap: 5px; z-index: 10;
    }
    .btn {
      background: rgba(10,10,35,0.9); border: 1px solid rgba(255,255,255,0.12);
      color: #bbb; padding: 6px 14px; border-radius: 6px;
      font-size: 0.72rem; cursor: pointer; transition: all 0.14s; white-space: nowrap;
      text-align: left;
    }
    .btn:hover { background: rgba(59,130,246,0.28); border-color: #3b82f6; color: #fff; }
    .btn.active { background: rgba(59,130,246,0.35); border-color: #3b82f6; color: #fff; }

    #legend {
      position: absolute; top: 56px; right: 12px; z-index: 5;
      background: rgba(10,10,35,0.9); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; padding: 10px 14px; pointer-events: none;
      transition: right 0.25s;
    }
    #legend.shifted { right: 310px; }
    .leg-row { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
    .leg-row:last-child { margin-bottom: 0; }
    .leg-swatch { width: 14px; height: 14px; border-radius: 2px; }
    .leg-label  { color: #888; font-size: 0.7rem; }

    #counter {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(10,10,35,0.9); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; padding: 8px 20px; color: #ccc; font-size: 0.78rem;
      pointer-events: none; white-space: nowrap;
    }
    #counter strong { color: #e2e8ff; }

    /* ── Edit Layout Panel ──────────────────────────────────── */
    #edit-toggle {
      position: absolute; top: 56px; right: 12px; z-index: 15;
      background: rgba(10,10,35,0.9); border: 1px solid rgba(255,255,255,0.12);
      color: #bbb; padding: 6px 14px; border-radius: 6px;
      font-size: 0.72rem; cursor: pointer; transition: all 0.14s;
    }
    #edit-toggle:hover { background: rgba(59,130,246,0.28); border-color: #3b82f6; color: #fff; }
    #edit-toggle.active { background: rgba(59,130,246,0.35); border-color: #3b82f6; color: #fff; }

    #edit-panel {
      position: absolute; top: 0; right: -300px; width: 290px; height: 100%;
      background: rgba(8,8,25,0.97); border-left: 1px solid rgba(255,255,255,0.08);
      display: flex; flex-direction: column; z-index: 14;
      transition: right 0.25s ease;
      overflow: hidden;
    }
    #edit-panel.open { right: 0; }

    #edit-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    #edit-header h2 { color: #c0caf5; font-size: 0.85rem; font-weight: 600; }
    #edit-close {
      background: none; border: none; color: #555; font-size: 1.1rem; cursor: pointer;
      line-height: 1; padding: 2px 4px;
    }
    #edit-close:hover { color: #fff; }

    #edit-tools {
      display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .tool-btn {
      background: rgba(30,30,60,0.9); border: 1px solid rgba(255,255,255,0.12);
      color: #aaa; padding: 4px 10px; border-radius: 5px;
      font-size: 0.68rem; cursor: pointer; transition: all 0.12s; white-space: nowrap;
    }
    .tool-btn:hover { background: rgba(59,130,246,0.28); border-color: #3b82f6; color: #fff; }
    #tool-status { color: #4ade80; font-size: 0.65rem; margin-left: 4px; }
    #tool-status.err { color: #f87171; }

    #edit-add-row {
      width: calc(100% - 20px); margin: 8px 10px 0;
      background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3);
      color: #4ade80; padding: 6px; border-radius: 6px;
      font-size: 0.72rem; cursor: pointer; transition: all 0.12s;
      flex-shrink: 0;
    }
    #edit-add-row:hover { background: rgba(34,197,94,0.25); }

    #row-list {
      flex: 1; overflow-y: auto; padding: 8px 10px 10px;
    }
    #row-list::-webkit-scrollbar { width: 4px; }
    #row-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

    .row-item {
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
      border-radius: 6px; padding: 7px 9px; margin-bottom: 5px; cursor: pointer;
    }
    .row-item:hover { background: rgba(255,255,255,0.03); }
    .row-item.selected { background: rgba(59,130,246,0.12); border-left: 2px solid #3b82f6; }
    .row-item-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .row-label { color: #c0caf5; font-size: 0.75rem; font-weight: 600; }
    .row-meta  { color: #555; font-size: 0.65rem; }

    .row-actions { display: flex; gap: 5px; }
    .edit-btn, .del-btn {
      background: none; border: 1px solid rgba(255,255,255,0.1); color: #666;
      padding: 2px 8px; border-radius: 4px; font-size: 0.65rem; cursor: pointer;
    }
    .edit-btn:hover { border-color: #3b82f6; color: #93c5fd; }
    .del-btn:hover  { border-color: #f87171; color: #f87171; }

    .row-editor {
      margin-top: 6px; background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.07); border-radius: 5px; padding: 8px;
    }
    .row-editor label { color: #888; font-size: 0.65rem; display: block; margin-bottom: 4px; }
    .level-inputs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
    .level-input {
      width: 36px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
      color: #ccc; border-radius: 4px; text-align: center; font-size: 0.75rem; padding: 3px;
    }
    .level-input:focus { outline: none; border-color: #3b82f6; }
    .editor-btns { display: flex; gap: 5px; flex-wrap: wrap; }
    .editor-btns button {
      background: rgba(30,30,60,0.9); border: 1px solid rgba(255,255,255,0.1);
      color: #aaa; padding: 3px 9px; border-radius: 4px; font-size: 0.65rem; cursor: pointer;
    }
    .editor-btns button:hover { background: rgba(59,130,246,0.28); border-color: #3b82f6; color: #fff; }

    /* move-mode drag banner */
    #drag-banner {
      display: none; position: absolute; top: 48px; left: 0; right: 0;
      background: rgba(234,179,8,0.18); border-bottom: 1px solid rgba(234,179,8,0.45);
      color: #fde047; text-align: center; font-size: 0.72rem; padding: 5px 0; z-index: 16;
    }
    #drag-banner.show { display: block; }

    #move-toggle-btn {
      width: calc(100% - 20px); margin: 6px 10px 4px;
      background: rgba(234,179,8,0.10); border: 1px solid rgba(234,179,8,0.3);
      color: #fde047; padding: 6px; border-radius: 6px;
      font-size: 0.72rem; cursor: pointer; transition: all 0.12s;
      flex-shrink: 0;
    }
    #move-toggle-btn:hover { background: rgba(234,179,8,0.2); }

    #del-col-toggle-btn {
      width: calc(100% - 20px); margin: 0 10px 4px;
      background: rgba(239,68,68,0.10); border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5; padding: 6px; border-radius: 6px;
      font-size: 0.72rem; cursor: pointer; transition: all 0.12s;
      flex-shrink: 0;
    }
    #del-col-toggle-btn:hover { background: rgba(239,68,68,0.2); }
    #del-col-toggle-btn.active {
      background: rgba(239,68,68,0.35); border-color: #ef4444; color: #fff;
    }
  </style>
</head>
<body>
<div id="app">
  <div id="hud">
    <h1>MNL WAREHOUSE</h1>
    <span id="hud-hint">Left-drag: rotate  |  Scroll: zoom  |  Right-drag: pan  |  Click spot: toggle full/empty</span>
  </div>
  <div id="drag-banner">MOVE MODE — drag a row left/right &nbsp;|&nbsp; scroll to zoom &nbsp;|&nbsp; right-drag to pan</div>

  <div id="sidebar">
    <button class="btn" id="vTop">⊡ Top</button>
    <button class="btn" id="vIso">⟳ Iso</button>
    <button class="btn" id="vSide">↔ Side</button>
    <hr style="border-color:rgba(255,255,255,0.07);margin:2px 0">
    <button class="btn" id="bReset">✕ Clear All</button>
    <button class="btn" id="bFill">■ Fill All</button>
  </div>

  <button id="edit-toggle">✏ Edit Layout</button>

  <div id="edit-panel">
    <div id="edit-header">
      <h2>Edit Layout</h2>
      <button id="edit-close">✕</button>
    </div>
    <div id="edit-tools">
      <button class="tool-btn" id="saveBtn">💾 Save</button>
      <button class="tool-btn" id="exportBtn">⬇ Export</button>
      <button class="tool-btn" id="importBtn">⬆ Import</button>
      <button class="tool-btn" id="fitBtn" title="Evenly distribute all rows to fit the room">⤢ Fit Rows</button>
      <button class="tool-btn" id="resetBtn" title="Clear saved layout and restore the default">↺ Reset</button>
      <span id="tool-status"></span>
      <input type="file" id="importInput" accept="application/json,.json" hidden>
    </div>
    <button id="move-toggle-btn">✕ Move Rows (drag)</button>
    <button id="del-col-toggle-btn">✂ Delete Upright</button>
    <button id="edit-add-row">+ Add Row</button>
    <div id="row-list"></div>
  </div>

  <div id="legend">
    <div class="leg-row"><div class="leg-swatch" style="background:#4ade80"></div><span class="leg-label">Empty</span></div>
    <div class="leg-row"><div class="leg-swatch" style="background:#f87171"></div><span class="leg-label">Full</span></div>
    <div class="leg-row"><div class="leg-swatch" style="background:#60a5fa"></div><span class="leg-label">Hovered</span></div>
  </div>

  <div id="counter">
    <strong id="ct">0</strong> total spots &nbsp;|&nbsp;
    <strong id="cf">0</strong> full &nbsp;|&nbsp;
    <strong id="ce">0</strong> empty
  </div>

  <div id="tooltip">
    <div id="tt-loc"></div>
    <div id="tt-status"></div>
    <div id="tt-hint">Click to toggle</div>
  </div>
</div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
(function(){
  'use strict';

  // ── Constants ────────────────────────────────────────────────────────────
  var RACK_D=1.2, SPOT_W=1.1, COL_Z=SPOT_W, LVL_H=2.0;
  var BACK_GAP=0.22, AISLE=4.5;
  var PAIR_W=2*RACK_D+BACK_GAP, PAIR_P=PAIR_W+AISLE;
  var SPOT_H=1.5, UT=0.10, GRID_SNAP=0.1;
  // Back wall reference: column 1 of every row is anchored 4 ft (1.2192 m)
  // off the wall so all column 1's line up down the whole layout.
  var BACK_WALL_Z=0, WALL_OFF=1.2192;
  // Real room dimensions: 300 ft × 80 ft
  var ROOM_W=91.44, ROOM_D=24.384;

  var C_EMPTY=0x4ade80, C_FULL=0xf87171, C_HOVER=0x60a5fa, C_FLOOR=0x1a1a2e;
  var C_BEAM=0x334155, C_POST=0x475569, C_UPR=0x1e3a5f;

  // ── Default layout ───────────────────────────────────────────────────────
  function makeColumns(pattern, count){
    var cols=[];
    for(var i=0;i<count;i++) cols.push(pattern[i%pattern.length]);
    return cols;
  }
  var DEFAULT_TYPES = {
    A: makeColumns([4,5,5,6], 19),
    B: makeColumns([4,5,5,6,6,5], 19),
    C: makeColumns([4,5,5,6,6], 19),
    D: makeColumns([4,5,5,6,6,5], 19)
  };
  var ROW_GROUPS = [[4,'A'],[8,'B'],[8,'C'],[14,'D']];

  function buildDefaultLayout(){
    var rows=[];
    ROW_GROUPS.forEach(function(g){ for(var i=0;i<g[0];i++) rows.push({levels:DEFAULT_TYPES[g[1]].slice(),x:null}); });
    return rows;
  }

  // ── State ────────────────────────────────────────────────────────────────
  var layoutData = buildDefaultLayout();

  // ── Persistence ─────────────────────────────────────────────────────────
  var STORE_KEY = 'mnl-warehouse-layout-v1';
  function collectState(){
    return {
      v: 1,
      layout: layoutData.map(function(r){ return {levels:r.levels.slice(), x:r.x, noFrames:(r.noFrames||[]).slice()}; }),
      full: skids.filter(function(s){ return s.userData.isFull; }).map(function(s){ return s.userData.id; })
    };
  }
  function saveLocal(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(collectState())); return true; }
    catch(e){ return false; }
  }
  function loadLocal(){
    try{ var raw=localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  }
  function applyLayout(state){
    if(!state||!state.layout||!state.layout.length) return;
    layoutData = state.layout.map(function(r){ return {levels:r.levels.slice(), x:r.x!==undefined?r.x:null, noFrames:(r.noFrames||[]).slice()}; });
    initPositions();
  }
  function applyFull(fullArr){
    if(!fullArr||!fullArr.length) return;
    var set = {}; fullArr.forEach(function(id){ set[id]=true; });
    skids.forEach(function(s){
      s.userData.isFull = !!set[s.userData.id];
      s.material.color.setHex(spotCol(s));
    });
    updateCounters();
  }
  function exportLayout(){
    var data = JSON.stringify(collectState(), null, 2);
    var blob = new Blob([data], {type:'application/json'});
    var url  = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href=url; a.download='warehouse-layout.json'; a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  var _statusTimer = null;
  function flashStatus(msg, isErr){
    var el = document.getElementById('tool-status');
    el.textContent = msg;
    el.className = isErr ? 'err' : '';
    if(_statusTimer) clearTimeout(_statusTimer);
    _statusTimer = setTimeout(function(){ el.textContent=''; }, 2000);
  }

  // ── Three.js setup ───────────────────────────────────────────────────────
  var scene    = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1117);
  scene.fog = new THREE.FogExp2(0x0d1117, 0.008);

  var camera   = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 800);
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.getElementById('app').appendChild(renderer.domElement);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance  = 5;
  controls.maxDistance  = 350;

  // ── Lighting ─────────────────────────────────────────────────────────────
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  var sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(40,80,60); sun.castShadow=true;
  sun.shadow.mapSize.width=sun.shadow.mapSize.height=2048;
  scene.add(sun);
  scene.add(new THREE.DirectionalLight(0x8090ff,0.25).position.set(-50,30,-40));

  // ── Helpers ──────────────────────────────────────────────────────────────
  var raycaster = new THREE.Raycaster();
  var mouse     = new THREE.Vector2();
  var floorPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
  var floorPt    = new THREE.Vector3();

  function box(w,h,d,col,rx,ry,rz){
    var g=new THREE.BoxGeometry(w,h,d);
    var m=new THREE.MeshLambertMaterial({color:col});
    var mesh=new THREE.Mesh(g,m);
    mesh.position.set(rx,ry,rz);
    return mesh;
  }

  // ── Row-number sprite ────────────────────────────────────────────────────
  function makeRowLabel(parent, text, lx, ly, lz){
    var size=128;
    var cv=document.createElement('canvas'); cv.width=size*2; cv.height=size;
    var ctx=cv.getContext('2d');
    ctx.fillStyle='rgba(0,0,0,0)'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.font='bold 64px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#facc15'; ctx.fillText(text, cv.width/2, cv.height/2);
    var tex=new THREE.CanvasTexture(cv);
    var mat=new THREE.SpriteMaterial({map:tex, depthTest:false, transparent:true});
    var sp=new THREE.Sprite(mat); sp.scale.set(2.4,1.2,1);
    sp.position.set(lx, ly, lz);
    parent.add(sp);
  }

  // ── Init rack positions ──────────────────────────────────────────────────
  // Distribute back-to-back pairs evenly across the room width, compressing
  // the aisle pitch when needed so everything fits inside the 300 ft footprint
  // (never spaced wider than the natural PAIR_P).
  function pairPitch(nPairs){
    var margin=1.5;                       // gap from each side wall
    var usable=ROOM_W-2*margin;
    if(nPairs<=1) return 0;
    return Math.min(PAIR_P, (usable-PAIR_W)/(nPairs-1));
  }
  function initPositions(){
    var nPairs=Math.ceil(layoutData.length/2);
    var pitch=pairPitch(nPairs);
    var span=(nPairs-1)*pitch+PAIR_W;
    var fpX=-span/2+PAIR_W/2;              // centered at room center (x=0)
    layoutData.forEach(function(row,ri){
      if(row.x!==null) return;
      var pi=Math.floor(ri/2), side=ri%2;
      var pc=fpX+pi*pitch;
      row.x=pc+(side===0?-(BACK_GAP/2+RACK_D/2):(BACK_GAP/2+RACK_D/2));
    });
  }
  // Force every row back into an evenly-fitted arrangement (ignores any
  // manual drag positions) — used by the "Fit Rows" button.
  function fitRows(){
    layoutData.forEach(function(row){ row.x=null; });
    initPositions();
  }

  // ── Scene objects ────────────────────────────────────────────────────────
  var skids=[], rowGroups=[], posts=[];
  var staticMeshes=[], floorMesh=null;

  function spotCol(mesh){ return mesh.userData.isFull ? C_FULL : C_EMPTY; }

  function allRackMeshes(){ return rowGroups.map(function(g){ return g.children; }).reduce(function(a,b){ return a.concat(Array.from(b)); },[]); }
  function ownerGroup(obj){
    var o=obj;
    while(o){ if(o.userData && o.userData.isRowGroup) return o; o=o.parent; }
    return null;
  }

  function buildRacks(){
    rowGroups.forEach(function(g){ scene.remove(g); });
    rowGroups=[]; skids=[]; posts=[];

    // x-sorted row numbering (R1 = leftmost)
    var sortedIdx=layoutData.map(function(_,i){return i;});
    sortedIdx.sort(function(a,b){return layoutData[a].x-layoutData[b].x;});
    var rowNumByIndex=[];
    sortedIdx.forEach(function(dataIdx,pos){rowNumByIndex[dataIdx]=pos+1;});

    layoutData.forEach(function(row,ri){
      var cols=row.levels;
      var nCols=cols.length;
      // Anchor column 1 a fixed set-back from the back wall (same for every
      // row) so all column 1's are lined up, regardless of column count.
      var z0=BACK_WALL_Z+WALL_OFF;
      var rg=new THREE.Group();
      rg.userData.isRowGroup=true; rg.userData.rowIndex=ri;
      rg.position.x=row.x;

      var rowNum=rowNumByIndex[ri];

      // Upright frames sit at each column boundary (Z-plane). Frame f spans
      // the rack depth between column f-1 and column f; interior frames
      // (1..nCols-1) are the supports "between pallet positions" and can be
      // removed via row.noFrames. Each frame = front + back post.
      var removed = row.noFrames || [];
      for(var f=0; f<=nCols; f++){
        if(removed.indexOf(f)>=0) continue;
        var hl=Math.max((f-1>=0?cols[f-1]:0),(f<nCols?cols[f]:0));
        if(hl<=0) continue;
        var fz=z0+f*COL_Z;
        [-RACK_D/2, RACK_D/2].forEach(function(px){
          var post=box(UT,hl*LVL_H+UT,UT,C_POST,px,hl*LVL_H/2,fz);
          post.userData={isFramePost:true, frameIdx:f, rowIndex:ri, nCols:nCols};
          rg.add(post); posts.push(post);
        });
      }

      cols.forEach(function(nLvl,ci){
        var cz=z0+ci*COL_Z+COL_Z/2;
        for(var lv=0;lv<nLvl;lv++){
          var y=lv*LVL_H;
          // beams
          var fb=box(RACK_D,UT,UT,C_BEAM,0,y+LVL_H-UT/2,cz-COL_Z*0.4); rg.add(fb);
          var bb=box(RACK_D,UT,UT,C_BEAM,0,y+LVL_H-UT/2,cz+COL_Z*0.4); rg.add(bb);
          // spot
          var sg=new THREE.BoxGeometry(RACK_D*0.82,SPOT_H,SPOT_W*0.82);
          var sm=new THREE.MeshLambertMaterial({color:C_EMPTY});
          var s=new THREE.Mesh(sg,sm);
          s.position.set(0, y+SPOT_H/2+UT, cz);
          var spotId='R'+rowNum+'-C'+(ci+1)+'-L'+(lv+1);
          s.userData={isFull:false, row:rowNum, col:ci+1, lvl:lv+1, id:spotId, isSpot:true};
          rg.add(s); skids.push(s);
        }
      });

      // row number label — outside face
      var labelX=(ri%2===0)?-(RACK_D/2+0.4):(RACK_D/2+0.4);
      makeRowLabel(rg,'R'+rowNum,labelX,2.2,z0+cols.length*COL_Z+2.0);

      scene.add(rg);
      rowGroups.push(rg);
    });
  }

  function computeBounds(){
    // Always frame to the real room so camera moves don't jump around
    return {
      cx: 0,
      z0: BACK_WALL_Z,
      wW: ROOM_W,
      wD: ROOM_D,
      minX: -ROOM_W/2,
      maxX:  ROOM_W/2
    };
  }

  function buildStatic(b){
    staticMeshes.forEach(function(m){ scene.remove(m); }); staticMeshes=[];
    if(floorMesh){ scene.remove(floorMesh); }
    // Floor always matches the real room (300 ft × 80 ft)
    var rcx=0, rcz=ROOM_D/2;
    var fg=new THREE.BoxGeometry(ROOM_W,0.3,ROOM_D);
    var fm=new THREE.MeshLambertMaterial({color:C_FLOOR});
    floorMesh=new THREE.Mesh(fg,fm);
    floorMesh.position.set(rcx,-0.15,rcz);
    floorMesh.receiveShadow=true;
    scene.add(floorMesh);
    // Grid scaled to the real room — 1 cell per 10 ft (3.048 m)
    var gridSize=Math.max(ROOM_W,ROOM_D)*1.05;
    var gridDiv=Math.round(Math.max(ROOM_W,ROOM_D)/3.048);
    var gl=new THREE.GridHelper(gridSize,gridDiv,0x1e293b,0x1e293b);
    gl.position.set(rcx,0,rcz);
    scene.add(gl); staticMeshes.push(gl);
    // Walls (back, front, left, right)
    var wallH=Math.max(SPOT_H,LVL_H)*2+2, wt=0.25;
    // back wall (Z = BACK_WALL_Z)
    var wBack=box(ROOM_W,wallH,wt,0x243049,rcx,wallH/2,BACK_WALL_Z-wt/2);
    scene.add(wBack); staticMeshes.push(wBack);
    // front wall (Z = ROOM_D)
    var wFront=box(ROOM_W,wallH,wt,0x243049,rcx,wallH/2,ROOM_D+wt/2);
    scene.add(wFront); staticMeshes.push(wFront);
    // left wall (X = -ROOM_W/2)
    var wLeft=box(wt,wallH,ROOM_D+wt*2,0x1e2a3a,-ROOM_W/2-wt/2,wallH/2,rcz);
    scene.add(wLeft); staticMeshes.push(wLeft);
    // right wall (X = +ROOM_W/2)
    var wRight=box(wt,wallH,ROOM_D+wt*2,0x1e2a3a,ROOM_W/2+wt/2,wallH/2,rcz);
    scene.add(wRight); staticMeshes.push(wRight);
  }

  var bounds;
  function rebuild(){
    initPositions();
    buildRacks();
    bounds=computeBounds();
    buildStatic(bounds);
    updateCounters();
    renderRowList();
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  var bootState = loadLocal();
  if(bootState) applyLayout(bootState);
  rebuild();
  if(bootState) applyFull(bootState.full);

  // Initial camera
  camera.position.set(bounds.cx-40, 100, bounds.z0+bounds.wD/2+130);
  controls.target.set(bounds.cx, 5, bounds.z0+bounds.wD/2);
  controls.update();

  // ── Render loop ───────────────────────────────────────────────────────────
  var drag=null, hovered=null;
  function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
  animate();

  // ── Counters ─────────────────────────────────────────────────────────────
  function updateCounters(){
    var tot=skids.length, full=skids.filter(function(s){return s.userData.isFull;}).length;
    document.getElementById('ct').textContent=tot;
    document.getElementById('cf').textContent=full;
    document.getElementById('ce').textContent=tot-full;
  }

  // ── Resize ───────────────────────────────────────────────────────────────
  window.addEventListener('resize',function(){
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });

  // ── Highlight ────────────────────────────────────────────────────────────
  function clearHighlight(){
    if(hovered){ hovered.material.color.setHex(spotCol(hovered)); hovered=null; }
  }

  // ── Pointer events ───────────────────────────────────────────────────────
  renderer.domElement.addEventListener('pointermove', function(e){
    mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    if(drag){
      raycaster.setFromCamera(mouse, camera);
      raycaster.ray.intersectPlane(floorPlane, floorPt);
      var nx = floorPt.x - drag.offsetX;
      nx = Math.round(nx / GRID_SNAP) * GRID_SNAP;
      drag.rg.position.x = nx;
      var meta = document.querySelectorAll('.row-meta');
      if(meta[drag.rowIndex]) meta[drag.rowIndex].textContent =
        layoutData[drag.rowIndex].levels.reduce(function(a,n){return a+n;},0)+' spots  x='+nx.toFixed(1)+'m';
      return;
    }

    if(editMode || deleteMode) return;
    raycaster.setFromCamera(mouse, camera);
    var hits = raycaster.intersectObjects(skids);
    var tooltip = document.getElementById('tooltip');
    if(hits.length && hits[0].object.userData.isSpot){
      var s=hits[0].object;
      if(hovered!==s){ clearHighlight(); hovered=s; s.material.color.setHex(C_HOVER); }
      document.getElementById('tt-loc').textContent=s.userData.id;
      var st=document.getElementById('tt-status');
      st.textContent=s.userData.isFull?'FULL':'EMPTY';
      st.className=s.userData.isFull?'full':'empty';
      tooltip.style.display='block';
      tooltip.style.left=(e.clientX+16)+'px';
      tooltip.style.top =(e.clientY-12)+'px';
      renderer.domElement.style.cursor='pointer';
    } else {
      tooltip.style.display='none';
      renderer.domElement.style.cursor='default';
    }
  });

  // Capture phase pointerdown — fires before OrbitControls; only intercepts
  // left-button drags on rack geometry so OrbitControls keeps zoom/pan.
  renderer.domElement.addEventListener('pointerdown', function(e){
    if(!editMode || e.button !== 0) return;
    mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    var hits = raycaster.intersectObjects(allRackMeshes());
    if(!hits.length) return;
    var rg = ownerGroup(hits[0].object);
    if(!rg) return;
    // Stop OrbitControls from also handling this pointer
    e.stopPropagation();
    raycaster.ray.intersectPlane(floorPlane, floorPt);
    drag = { rg: rg, rowIndex: rg.userData.rowIndex, offsetX: floorPt.x - rg.position.x };
  }, true);

  window.addEventListener('pointerup', function(){
    if(drag){
      layoutData[drag.rowIndex].x = drag.rg.position.x;
      drag = null;
      renderRowList();
    }
  });

  renderer.domElement.addEventListener('click', function(){
    if(editMode || deleteMode) return;
    if(!hovered) return;
    hovered.userData.isFull = !hovered.userData.isFull;
    hovered.material.color.setHex(spotCol(hovered));
    var st = document.getElementById('tt-status');
    st.textContent = hovered.userData.isFull ? 'FULL' : 'EMPTY';
    st.className   = hovered.userData.isFull ? 'full' : 'empty';
    updateCounters();
  });

  // ── View presets ─────────────────────────────────────────────────────────
  function cam(x,y,z){
    camera.position.set(x,y,z);
    controls.target.set(bounds.cx, 5, bounds.z0+bounds.wD/2);
    controls.update();
  }
  // Distance for a top-down view that frames the whole layout (so a drag of
  // one screen-pixel maps to a reasonable amount of world-X, not many metres)
  function topDownDist(b){
    var aspect = window.innerWidth / window.innerHeight;
    var vfov   = camera.fov * Math.PI / 180;
    var fitW   = (b.wW * 1.15) / (2 * Math.tan(vfov/2) * aspect);
    var fitD   = (b.wD * 1.15) / (2 * Math.tan(vfov/2));
    return Math.max(fitW, fitD, 25);
  }
  document.getElementById('vTop').onclick  = function(){ cam(bounds.cx, topDownDist(bounds), bounds.z0+bounds.wD/2+0.01); };
  document.getElementById('vIso').onclick  = function(){ cam(bounds.cx-40, 100, bounds.z0+bounds.wD/2+130); };
  document.getElementById('vSide').onclick = function(){ cam(bounds.minX-80, 60, bounds.z0+bounds.wD/2); };
  document.getElementById('bReset').onclick= function(){
    skids.forEach(function(s){ s.userData.isFull=false; s.material.color.setHex(C_EMPTY); });
    updateCounters();
  };
  document.getElementById('bFill').onclick = function(){
    skids.forEach(function(s){ s.userData.isFull=true; s.material.color.setHex(C_FULL); });
    updateCounters();
  };

  // ── Edit Panel ──────────────────────────────────────────────────────────
  var editPanel  = document.getElementById('edit-panel');
  var editToggle = document.getElementById('edit-toggle');
  var legend     = document.getElementById('legend');
  var dragBanner = document.getElementById('drag-banner');
  var hudHint    = document.getElementById('hud-hint');
  var selectedRow = null;

  function openPanel(){
    editPanel.classList.add('open');
    editToggle.classList.add('active');
    editToggle.style.display = 'none';   // hide floating toggle so it can't
                                          // overlap the panel's tools bar
    legend.classList.add('shifted');
  }
  function closePanel(){
    editPanel.classList.remove('open');
    editToggle.classList.remove('active');
    editToggle.style.display = '';
    legend.classList.remove('shifted');
    editMode = false;
    drag = null;
    if(deleteMode) exitDeleteMode();
    controls.enabled = true;
    controls.enableRotate = true;
    clearHighlight();
    dragBanner.classList.remove('show');
    hudHint.textContent = 'Left-drag: rotate  |  Scroll: zoom  |  Right-drag: pan  |  Click spot: toggle full/empty';
  }

  editToggle.addEventListener('click', function(){
    if(editPanel.classList.contains('open')){ closePanel(); } else { openPanel(); }
  });
  document.getElementById('edit-close').addEventListener('click', closePanel);

  document.getElementById('edit-panel').addEventListener('click', function(e){
    if(e.target.id === 'move-toggle-btn'){
      editMode = !editMode;
      var btn = document.getElementById('move-toggle-btn');
      if(editMode){
        btn.textContent = '✓ Done Moving Rows';
        btn.style.background = 'rgba(59,130,246,0.25)';
        btn.style.borderColor = '#3b82f6';
        btn.style.color = '#93c5fd';
        dragBanner.classList.add('show');
        hudHint.textContent = '✕ MOVE MODE: drag a row left/right to reposition it';
        renderer.domElement.style.cursor = 'grab';
        // Top-down view (so horizontal drag = world-X), framed to the whole
        // layout so a drag tracks the cursor at a sane scale (not metres/pixel).
        var mz = bounds.z0 + bounds.wD/2;
        camera.position.set(bounds.cx, topDownDist(bounds), mz + 0.01);
        controls.target.set(bounds.cx, 0, mz);
        controls.update();
        // Disable rotate; keep zoom (scroll) and pan (right-drag) active.
        // Row-drag uses capture-phase pointerdown + stopPropagation so it
        // intercepts left-button before OrbitControls sees it.
        controls.enableRotate = false;
        controls.enablePan    = true;
        controls.enableZoom   = true;
      } else {
        btn.textContent = '✕ Move Rows (drag)';
        btn.style.background = '';
        btn.style.borderColor = '';
        btn.style.color = '';
        dragBanner.classList.remove('show');
        hudHint.textContent = 'Left-drag: rotate  |  Scroll: zoom  |  Right-drag: pan  |  Click spot: toggle full/empty';
        renderer.domElement.style.cursor = 'default';
        controls.enableRotate = true;
        controls.enablePan    = true;
        controls.enableZoom   = true;
        clearHighlight();
        bounds = computeBounds();
        buildStatic(bounds);
      }
    }
  });

  function rowSpotCount(row){
    return row.levels.reduce(function(a,n){ return a+n; }, 0);
  }

  function renderRowList(){
    var list = document.getElementById('row-list');
    list.innerHTML = '';

    // x-sorted for display
    var sortedIdx = layoutData.map(function(_,i){return i;});
    sortedIdx.sort(function(a,b){return layoutData[a].x-layoutData[b].x;});

    sortedIdx.forEach(function(ri){
      var row = layoutData[ri];
      var rowNum = ri+1; // display number in data order; label sprite uses x-sort

      var item = document.createElement('div');
      item.className = 'row-item' + (selectedRow===ri ? ' selected' : '');

      var header = document.createElement('div');
      header.className = 'row-item-header';

      var info = document.createElement('div');

      var label = document.createElement('div');
      label.className = 'row-label';
      label.textContent = 'Row '+rowNum+' ('+row.levels.length+' cols)';

      var meta = document.createElement('div');
      meta.className = 'row-meta';
      meta.textContent = rowSpotCount(row)+' spots  x='+row.x.toFixed(1)+'m';

      info.appendChild(label);
      info.appendChild(meta);

      var actions = document.createElement('div');
      actions.className = 'row-actions';

      var editBtn = document.createElement('button');
      editBtn.className = 'edit-btn'; editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', function(e){
        e.stopPropagation();
        selectedRow = ri;
        renderRowList();
        var items = document.querySelectorAll('.row-item');
        if(items[ri+1]) items[ri+1].scrollIntoView({block:'nearest'});
      });

      var delBtn = document.createElement('button');
      delBtn.className = 'del-btn'; delBtn.textContent = 'Del';
      delBtn.addEventListener('click', function(e){
        e.stopPropagation();
        layoutData.splice(ri,1);
        if(selectedRow===ri) selectedRow=null;
        rebuild();
      });

      actions.appendChild(editBtn); actions.appendChild(delBtn);
      header.appendChild(info); header.appendChild(actions);
      item.appendChild(header);

      if(selectedRow === ri){
        item.appendChild(buildEditor(ri));
      }

      item.addEventListener('click', function(e){
        e.stopPropagation();
        selectedRow = (selectedRow===ri)?null:ri;
        renderRowList();
      });

      list.appendChild(item);
    });
  }

  function buildEditor(ri){
    var row = layoutData[ri];
    var editor = document.createElement('div');
    editor.className = 'row-editor';
    editor.addEventListener('click', function(e){ e.stopPropagation(); });

    var lbl = document.createElement('label');
    lbl.textContent = 'Spots per column (one box = one column):';
    editor.appendChild(lbl);

    var inputs = document.createElement('div');
    inputs.className = 'level-inputs';
    row.levels.forEach(function(n,i){
      var inp = document.createElement('input');
      inp.className='level-input'; inp.type='number'; inp.min=1; inp.max=12; inp.value=n;
      inp.addEventListener('change', function(){ row.levels[i]=Math.max(1,Math.min(12,parseInt(inp.value)||1)); });
      inputs.appendChild(inp);
    });
    editor.appendChild(inputs);

    var btns = document.createElement('div');
    btns.className = 'editor-btns';

    var addCol = document.createElement('button'); addCol.textContent='+ Col';
    addCol.addEventListener('click', function(e){
      e.stopPropagation();
      var last=row.levels[row.levels.length-1]||4;
      row.levels.push(last);
      rebuild();
    });

    var apply = document.createElement('button'); apply.textContent='Apply';
    apply.addEventListener('click', function(e){ e.stopPropagation(); rebuild(); });

    var cancel = document.createElement('button'); cancel.textContent='Cancel';
    cancel.addEventListener('click',function(e){ e.stopPropagation(); selectedRow=null; renderRowList(); });

    btns.appendChild(addCol); btns.appendChild(apply); btns.appendChild(cancel);
    editor.appendChild(btns);
    return editor;
  }

  document.getElementById('edit-add-row').addEventListener('click',function(){
    var tmpl = layoutData.length>0 ? layoutData[layoutData.length-1].levels.slice() : [4,5,5,6];
    var maxX = layoutData.length>0 ? layoutData.reduce(function(m,r){ return Math.max(m, r.x||0); }, -Infinity) : 0;
    layoutData.push({ levels: tmpl, x: maxX + PAIR_P });
    selectedRow = layoutData.length-1;
    rebuild();
    document.getElementById('row-list').scrollTop = 999999;
  });

  // ── Save / Export / Import / Reset ──────────────────────────────────────
  document.getElementById('saveBtn').addEventListener('click', function(){
    var ok = saveLocal();
    flashStatus(ok ? 'Saved ✓' : 'Save failed', !ok);
  });

  document.getElementById('exportBtn').addEventListener('click', function(){
    exportLayout();
    flashStatus('Exported ✓');
  });

  document.getElementById('importBtn').addEventListener('click', function(){
    document.getElementById('importInput').click();
  });
  document.getElementById('importInput').addEventListener('change', function(){
    var file = this.files && this.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var state = JSON.parse(ev.target.result);
        if(!state.layout) throw new Error('missing layout');
        applyLayout(state);
        rebuild();
        if(state.full) applyFull(state.full);
        flashStatus('Imported ✓');
      } catch(e){
        flashStatus('Import failed: '+e.message, true);
      }
    };
    reader.readAsText(file);
    this.value='';
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    if(!confirm('Clear saved layout and restore the default?')) return;
    localStorage.removeItem(STORE_KEY);
    layoutData = buildDefaultLayout();
    rebuild();
    flashStatus('Reset ✓');
  });

  document.getElementById('fitBtn').addEventListener('click', function(){
    fitRows();    // nulls all x; rebuild's initPositions re-fits them
    rebuild();
    flashStatus('Fitted ✓');
  });

  var editMode = false;
  var deleteMode = false;
  var delHovered = null; // { rowIndex, frameIdx, meshes[] }

  function rowNumFor(ri){
    var s=layoutData.map(function(_,i){return i;});
    s.sort(function(a,b){return layoutData[a].x-layoutData[b].x;});
    return s.indexOf(ri)+1;
  }

  function clearDelHover(){
    if(delHovered){
      delHovered.meshes.forEach(function(m){ m.material.color.setHex(C_POST); });
      delHovered=null;
    }
    document.getElementById('tooltip').style.display='none';
  }

  function enterDeleteMode(){
    // exit move mode first if active
    if(editMode){
      editMode=false;
      var mBtn=document.getElementById('move-toggle-btn');
      mBtn.textContent='✕ Move Rows (drag)';
      mBtn.style.background=mBtn.style.borderColor=mBtn.style.color='';
      document.getElementById('drag-banner').classList.remove('show');
      controls.enableRotate=true;
    }
    deleteMode=true;
    var btn=document.getElementById('del-col-toggle-btn');
    btn.classList.add('active');
    btn.textContent='✓ Done Deleting';
    document.getElementById('hud-hint').textContent='DELETE MODE: click an upright frame between two pallet positions to remove it';
    renderer.domElement.style.cursor='crosshair';
  }
  function exitDeleteMode(){
    deleteMode=false;
    clearDelHover();
    var btn=document.getElementById('del-col-toggle-btn');
    btn.classList.remove('active');
    btn.textContent='✂ Delete Upright';
    document.getElementById('hud-hint').textContent='Left-drag: rotate  |  Scroll: zoom  |  Right-drag: pan  |  Click spot: toggle full/empty';
    renderer.domElement.style.cursor='default';
  }

  document.getElementById('del-col-toggle-btn').addEventListener('click', function(){
    if(deleteMode){ exitDeleteMode(); } else { enterDeleteMode(); }
  });

  // Delete-mode pointermove: highlight the upright frame (both posts) under cursor
  renderer.domElement.addEventListener('pointermove', function(e){
    if(!deleteMode) return;
    mouse.x=(e.clientX/window.innerWidth)*2-1;
    mouse.y=-(e.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse,camera);
    var hits=raycaster.intersectObjects(posts);
    if(!hits.length){ clearDelHover(); return; }
    var p=hits[0].object;
    var ri=p.userData.rowIndex, fi=p.userData.frameIdx, nC=p.userData.nCols;
    // only interior frames are "between pallet positions"
    if(fi<=0 || fi>=nC){ clearDelHover(); return; }
    if(delHovered && delHovered.rowIndex===ri && delHovered.frameIdx===fi) return;
    clearDelHover();
    var frameMeshes=posts.filter(function(m){ return m.userData.rowIndex===ri && m.userData.frameIdx===fi; });
    frameMeshes.forEach(function(m){ m.material.color.setHex(0xef4444); });
    delHovered={rowIndex:ri, frameIdx:fi, meshes:frameMeshes};
    var tooltip=document.getElementById('tooltip');
    document.getElementById('tt-loc').textContent='Row '+rowNumFor(ri)+' · upright between bay '+fi+' & '+(fi+1);
    document.getElementById('tt-status').textContent='Click to remove upright';
    document.getElementById('tt-status').className='full';
    tooltip.style.display='block';
    tooltip.style.left=(e.clientX+16)+'px';
    tooltip.style.top=(e.clientY-12)+'px';
    renderer.domElement.style.cursor='crosshair';
  }, false);

  // Delete-mode click: re-raycast to confirm frame is still under cursor before deleting
  renderer.domElement.addEventListener('click', function(e){
    if(!deleteMode) return;
    if(!delHovered) return;
    mouse.x=(e.clientX/window.innerWidth)*2-1;
    mouse.y=-(e.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse,camera);
    var hits=raycaster.intersectObjects(posts);
    if(!hits.length){ clearDelHover(); return; }
    var p=hits[0].object;
    var fi2=p.userData.frameIdx, nC=p.userData.nCols;
    if(fi2<=0 || fi2>=nC){ clearDelHover(); return; }
    if(p.userData.rowIndex!==delHovered.rowIndex || fi2!==delHovered.frameIdx){ clearDelHover(); return; }
    var ri=delHovered.rowIndex, fi=delHovered.frameIdx;
    delHovered=null;
    var row=layoutData[ri];
    if(!row) return;
    if(!row.noFrames) row.noFrames=[];
    if(row.noFrames.indexOf(fi)<0) row.noFrames.push(fi);
    rebuild();
  }, false);

  renderRowList();
})();
</script>
</body>
</html>
