<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warehouse 3D Map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    #app { width: 100vw; height: 100vh; position: relative; }

    #hud {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px;
      background: rgba(10,10,30,0.85);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      z-index: 10; pointer-events: none;
    }
    #hud h1 { color: #e0e0ff; font-size: 1.1rem; font-weight: 600; letter-spacing: 1px; }
    #hud span { color: #666; font-size: 0.75rem; }

    #tooltip {
      position: absolute; display: none; z-index: 20;
      background: rgba(10,10,40,0.95); border: 1px solid rgba(100,180,255,0.4);
      border-radius: 8px; padding: 10px 14px; pointer-events: none; min-width: 150px;
    }
    #tt-loc    { font-size: 1rem; font-weight: 700; color: #7dd3fc; margin-bottom: 4px; }
    #tt-status { font-weight: 600; font-size: 0.85rem; }
    #tt-status.empty { color: #4ade80; }
    #tt-status.full  { color: #f87171; }
    #tt-hint   { color: #555; font-size: 0.7rem; margin-top: 5px; }

    #sidebar {
      position: absolute; top: 64px; left: 14px;
      display: flex; flex-direction: column; gap: 6px; z-index: 10;
    }
    .btn {
      background: rgba(10,10,40,0.88); border: 1px solid rgba(255,255,255,0.15);
      color: #ccc; padding: 7px 16px; border-radius: 6px;
      font-size: 0.75rem; cursor: pointer; transition: all 0.15s;
    }
    .btn:hover { background: rgba(59,130,246,0.3); border-color: #3b82f6; color: #fff; }

    #legend {
      position: absolute; top: 64px; right: 14px; z-index: 10;
      background: rgba(10,10,40,0.88); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 12px 16px; pointer-events: none;
    }
    #legend h3 { color: #888; font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
    .li { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 0.78rem; color: #ccc; }
    .sw { width: 13px; height: 13px; border-radius: 3px; }

    #bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center; gap: 40px;
      padding: 14px 0;
      background: rgba(10,10,30,0.9); border-top: 1px solid rgba(255,255,255,0.1);
      z-index: 10; pointer-events: none;
    }
    .stat { text-align: center; }
    .stat .n { font-size: 2rem; font-weight: 800; line-height: 1; }
    .stat .l { font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
    #s-empty .n { color: #4ade80; } #s-empty .l { color: #166534; }
    #s-full  .n { color: #f87171; } #s-full  .l { color: #991b1b; }
    #s-total .n { color: #93c5fd; } #s-total .l { color: #1e40af; }
    .div { width: 1px; height: 38px; background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>
<div id="app">
  <div id="hud">
    <h1>WAREHOUSE 3D MAP</h1>
    <span>Drag: rotate &nbsp;|&nbsp; Scroll: zoom &nbsp;|&nbsp; Right-drag: pan &nbsp;|&nbsp; Click spot: toggle full/empty</span>
  </div>

  <div id="tooltip">
    <div id="tt-loc"></div>
    <div id="tt-status"></div>
    <div id="tt-hint">Click to toggle</div>
  </div>

  <div id="sidebar">
    <button class="btn" id="vTop">Top View</button>
    <button class="btn" id="vFront">Front View</button>
    <button class="btn" id="vIso">Isometric</button>
    <button class="btn" id="bReset">Reset → Empty</button>
    <button class="btn" id="bFill">Set All → Full</button>
  </div>

  <div id="legend">
    <h3>Legend</h3>
    <div class="li"><div class="sw" style="background:#22c55e"></div>Empty</div>
    <div class="li"><div class="sw" style="background:#ef4444"></div>Full</div>
    <div class="li"><div class="sw" style="background:#facc15"></div>Hovered</div>
  </div>

  <div id="bar">
    <div class="stat" id="s-empty"><div class="n" id="c-empty">0</div><div class="l">Empty</div></div>
    <div class="div"></div>
    <div class="stat" id="s-full"> <div class="n" id="c-full">0</div> <div class="l">Full</div></div>
    <div class="div"></div>
    <div class="stat" id="s-total"><div class="n" id="c-total">0</div><div class="l">Total</div></div>
  </div>
</div>

<!-- Three.js r128 — known-good CDN, global THREE + OrbitControls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
(function () {
  'use strict';

  // ── Renderer ───────────────────────────────────────────────────────────
  var app      = document.getElementById('app');
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.setClearColor(0x0d1117, 1);
  app.appendChild(renderer.domElement);

  var scene  = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 400);
  camera.position.set(0, 55, 80);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.minDistance   = 8;
  controls.maxDistance   = 160;
  controls.maxPolarAngle = Math.PI / 2.1;
  controls.target.set(0, 4, 0);
  controls.update();

  // ── Lighting ───────────────────────────────────────────────────────────
  scene.add(new THREE.AmbientLight(0x8090b0, 0.8));

  var sun = new THREE.DirectionalLight(0xffffff, 1.2);
  sun.position.set(40, 70, 40);
  sun.castShadow = true;
  sun.shadow.mapSize.width  = 2048;
  sun.shadow.mapSize.height = 2048;
  sun.shadow.camera.left   = -70;
  sun.shadow.camera.right  =  70;
  sun.shadow.camera.top    =  50;
  sun.shadow.camera.bottom = -50;
  sun.shadow.camera.far    = 200;
  scene.add(sun);

  var fill = new THREE.DirectionalLight(0x4466ff, 0.3);
  fill.position.set(-30, 15, -20);
  scene.add(fill);

  // ── Colours ────────────────────────────────────────────────────────────
  var C_EMPTY = 0x22c55e;
  var C_FULL  = 0xef4444;
  var C_HOVER = 0xfacc15;

  // ── Materials ──────────────────────────────────────────────────────────
  var mFloor  = new THREE.MeshLambertMaterial({ color: 0x2d3748 });
  var mWall   = new THREE.MeshLambertMaterial({ color: 0x334155, transparent: true, opacity: 0.3 });
  var mUpright= new THREE.MeshLambertMaterial({ color: 0x4a5568 });
  var mBeam   = new THREE.MeshLambertMaterial({ color: 0x1e3a5f });
  var mPallet = new THREE.MeshLambertMaterial({ color: 0x78350f });

  function makeMesh(geo, mat, x, y, z, cast, recv) {
    var m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    if (cast)  m.castShadow    = true;
    if (recv)  m.receiveShadow = true;
    scene.add(m);
    return m;
  }
  function box(w, h, d, mat, x, y, z, cast, recv) {
    return makeMesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, cast, recv);
  }

  // ── Warehouse shell ────────────────────────────────────────────────────
  var FW = 88, FD = 38, WH = 12;

  // Floor
  box(FW + 8, 0.3, FD + 8, mFloor, 0, -0.15, 0, false, true);
  var grid = new THREE.GridHelper(FW + 8, 22, 0x1e3a5f, 0x1e3a5f);
  grid.position.y = 0.02;
  scene.add(grid);

  // Walls
  box(FW+8, WH, 0.3, mWall, 0,        WH/2, -(FD/2+4), false, false);
  box(FW+8, WH, 0.3, mWall, 0,        WH/2,  (FD/2+4), false, false);
  box(0.3, WH, FD+8, mWall, -(FW/2+4), WH/2, 0,        false, false);
  box(0.3, WH, FD+8, mWall,  (FW/2+4), WH/2, 0,        false, false);

  // ── Rack dimensions ────────────────────────────────────────────────────
  var SPOT_W  = 2.8;   // bay width
  var SPOT_D  = 2.2;   // bay depth
  var SPOT_H  = 1.6;   // load height
  var LEVELS  = 3;
  var LVL_H   = 2.5;   // height per level

  // ── Zone table ─────────────────────────────────────────────────────────
  // Based on photo: long rectangle, racks in 4 column-groups, 2 rows each
  // (front row + back row), separated by a central main aisle at z=0
  // Cross aisles divide left, centre-left, centre-right, right sections
  var ZONES = [
    { id:'A', x:-42, cols:5, z:-9 },
    { id:'B', x:-42, cols:5, z: 4 },
    { id:'C', x:-18, cols:4, z:-9 },
    { id:'D', x:-18, cols:4, z: 4 },
    { id:'E', x:  2, cols:3, z:-9 },
    { id:'F', x:  2, cols:3, z: 4 },
    { id:'G', x: 18, cols:5, z:-9 },
    { id:'H', x: 18, cols:5, z: 4 },
  ];

  var skids = [];

  function buildZone(zone) {
    var sx = zone.x, cols = zone.cols, sz = zone.z, id = zone.id;
    var rw = cols * SPOT_W;
    var rd = SPOT_D * 0.9;

    // Uprights
    for (var c = 0; c <= cols; c++) {
      for (var lv = 0; lv < LEVELS; lv++) {
        box(0.14, LVL_H, rd, mUpright,
            sx + c * SPOT_W,
            lv * LVL_H + LVL_H / 2,
            sz + rd / 2,
            true, false);
      }
    }

    // Beams per level
    for (var lv = 1; lv <= LEVELS; lv++) {
      var by = lv * LVL_H - 0.08;
      box(rw, 0.12, 0.12, mBeam, sx + rw/2, by, sz + rd * 0.1, false, false);
      box(rw, 0.12, 0.12, mBeam, sx + rw/2, by, sz + rd * 0.9, false, false);
    }

    // Skid spots
    for (var col = 0; col < cols; col++) {
      for (var lv = 0; lv < LEVELS; lv++) {
        var cx = sx + col * SPOT_W + SPOT_W / 2;
        var cy = lv * LVL_H + 0.14 + SPOT_H / 2;
        var cz = sz + SPOT_D / 2;
        var locId = id + (col + 1) + '-L' + (lv + 1);

        // Pallet
        box(SPOT_W - 0.3, 0.12, SPOT_D - 0.2, mPallet,
            cx, lv * LVL_H + 0.06, cz, true, false);

        // Interactive box
        var mat  = new THREE.MeshLambertMaterial({ color: C_EMPTY });
        var spot = new THREE.Mesh(
          new THREE.BoxGeometry(SPOT_W - 0.4, SPOT_H, SPOT_D - 0.3),
          mat
        );
        spot.position.set(cx, cy, cz);
        spot.castShadow    = true;
        spot.receiveShadow = true;
        spot.userData      = { locId: locId, isFull: false };
        scene.add(spot);
        skids.push(spot);
      }
    }
  }

  ZONES.forEach(buildZone);

  // ── Counters ───────────────────────────────────────────────────────────
  function updateCounters() {
    var full  = skids.filter(function(s){ return s.userData.isFull; }).length;
    document.getElementById('c-empty').textContent = skids.length - full;
    document.getElementById('c-full').textContent  = full;
    document.getElementById('c-total').textContent = skids.length;
  }
  updateCounters();

  // ── Raycasting ─────────────────────────────────────────────────────────
  var raycaster = new THREE.Raycaster();
  var mouse     = new THREE.Vector2();
  var hovered   = null;
  var tooltip   = document.getElementById('tooltip');

  function spotCol(s) { return s.userData.isFull ? C_FULL : C_EMPTY; }

  renderer.domElement.addEventListener('mousemove', function(e) {
    mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    var hits = raycaster.intersectObjects(skids);

    if (hovered) { hovered.material.color.setHex(spotCol(hovered)); hovered = null; }

    if (hits.length > 0) {
      hovered = hits[0].object;
      hovered.material.color.setHex(C_HOVER);
      var d = hovered.userData;
      document.getElementById('tt-loc').textContent = d.locId;
      var st = document.getElementById('tt-status');
      st.textContent = d.isFull ? 'FULL' : 'EMPTY';
      st.className   = d.isFull ? 'full' : 'empty';
      tooltip.style.display = 'block';
      tooltip.style.left    = (e.clientX + 16) + 'px';
      tooltip.style.top     = (e.clientY - 12) + 'px';
      renderer.domElement.style.cursor = 'pointer';
    } else {
      tooltip.style.display = 'none';
      renderer.domElement.style.cursor = 'default';
    }
  });

  renderer.domElement.addEventListener('click', function() {
    if (!hovered) return;
    hovered.userData.isFull = !hovered.userData.isFull;
    hovered.material.color.setHex(spotCol(hovered));
    var st = document.getElementById('tt-status');
    st.textContent = hovered.userData.isFull ? 'FULL' : 'EMPTY';
    st.className   = hovered.userData.isFull ? 'full' : 'empty';
    updateCounters();
  });

  // ── View buttons ───────────────────────────────────────────────────────
  function cam(x, y, z) {
    camera.position.set(x, y, z);
    controls.target.set(0, 4, 0);
    controls.update();
  }
  document.getElementById('vTop').onclick   = function(){ cam(0, 110, 0.01); };
  document.getElementById('vFront').onclick = function(){ cam(0, 14, 90); };
  document.getElementById('vIso').onclick   = function(){ cam(60, 55, 65); };
  document.getElementById('bReset').onclick = function(){
    skids.forEach(function(s){ s.userData.isFull = false; s.material.color.setHex(C_EMPTY); });
    updateCounters();
  };
  document.getElementById('bFill').onclick = function(){
    skids.forEach(function(s){ s.userData.isFull = true; s.material.color.setHex(C_FULL); });
    updateCounters();
  };

  // ── Resize ─────────────────────────────────────────────────────────────
  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ── Loop ───────────────────────────────────────────────────────────────
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
